<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>PWNBoard Login</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
        <script src="{{ url_for('static', filename='vendor/jquery.slim.min.js') }}"></script>
        <script src="{{ url_for('static', filename='vendor/popper.min.js') }}"></script>
        <script src="{{ url_for('static', filename='vendor/bootstrap.min.js') }}"></script>
        <link href='https://fonts.googleapis.com/css?family=Titillium+Web:600,400&display=swap' rel='stylesheet' type='text/css' />
        <link href='https://fonts.googleapis.com/css?family=Jura:400,600&display=swap' rel='stylesheet' type='text/css' />
        <link rel='stylesheet' href="{{ url_for('static', filename='login.css') }}" type='text/css' />
    </head>

    <body>
        <div class="container min-vh-100 d-flex align-items-center justify-content-center">
            <div class="row w-100 justify-content-center">
                <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                    <div class="card login-card p-4">
                        <div class="card-body">
                            <div class="text-center mb-3">
                                <h2 class="brand mb-0">PWNBoard</h2>
                            </div>

                            {% if error %}
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                {{ error }}
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            {% endif %}

                            <form method="POST" action="/">
                                <div class="form-group">
                                    <label for="username" class="small-muted">Username</label>
                                    <input id="username" name="username" type="text" class="form-control form-control-lg" placeholder="username" required>
                                </div>
                                <div class="form-group">
                                    <label for="password" class="small-muted">Password</label>
                                    <input id="password" name="password" type="password" class="form-control form-control-lg" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
                            </form>

                            <hr class="my-4" style="border-color: rgba(255,255,255,0.04)">
                            <div class="text-center small-muted">
                                {{ LOGIN_PAGE_MESSAGE }}
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-3 small-muted">PWNBoard</div>
                </div>
            </div>
        </div>
    </body>
</html>
