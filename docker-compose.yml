# Keep container logs from filling the disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  pwnboard:
    image: ghcr.io/max-49/pwnboard:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - FLASK_DEBUG=false
      - FLASK_PORT=5000
      - POSTGRES_PASSWORD=${PWNBOARD_PASSWORD}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-${PWNBOARD_PASSWORD}}
      - SECRET_KEY=${SECRET_KEY}
      - REFRESH_SECONDS=10 # Seconds after which to refresh the page
      - HOST_TIMEOUT=5
      - CREDS_TIMEOUT=30
      - DEFAULT_USER=admin
      - DEFAULT_USER_PASSWORD=${PWNBOARD_PASSWORD}
      - LOGIN_PAGE_MESSAGE=Contact an admin to get an account!
      - USE_ACCESS_TOKENS=true
    volumes:
      - ./board.json:/opt/pwnboard/board.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:alpine
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:15-alpine
    restart: always
    logging: *default-logging
    command: postgres -c synchronous_commit=off
    environment:
      POSTGRES_DB: pwnboard_db
      POSTGRES_USER: pwnboard_user
      POSTGRES_PASSWORD: ${PWNBOARD_PASSWORD}
    volumes:
      - pwnboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwnboard_user -d pwnboard_db"]
      interval: 2s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/max-49/pwnboard-worker:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_PASSWORD=${PWNBOARD_PASSWORD}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-${PWNBOARD_PASSWORD}}
    volumes:
      - ./board.json:/opt/pwnboard/board.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  data:
    image: grafana/grafana:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${PWNBOARD_PASSWORD}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-${PWNBOARD_PASSWORD}}
      - GF_PLUGINS_PREINSTALL=magnesium-wordcloud-panel
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    volumes:
      - ./conf/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./conf/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./conf/grafana/provisioning/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - db

  reverse-proxy:
    image: caddy:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./conf/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - PWNBOARD_DOMAIN=${PWNBOARD_DOMAIN}

volumes:
  pwnboard-data:
  caddy_data:
  caddy_config:
