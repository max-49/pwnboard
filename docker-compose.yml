# Keep container logs from filling the disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Timeouts, in minutes. The worker builds the board that the web app displays, so both
# services need the same values. Change them by setting HOST_TIMEOUT / CREDS_TIMEOUT in .env.
x-timeouts:
  host: &host-timeout HOST_TIMEOUT=${HOST_TIMEOUT:-5}
  creds: &creds-timeout CREDS_TIMEOUT=${CREDS_TIMEOUT:-30}

services:
  pwnboard:
    image: ghcr.io/max-49/pwnboard:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - FLASK_DEBUG=false
      - FLASK_PORT=5000
      - POSTGRES_PASSWORD=${PWNBOARD_PASSWORD}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-${PWNBOARD_PASSWORD}}
      - SECRET_KEY=${SECRET_KEY}
      - REFRESH_SECONDS=10 # Seconds after which to refresh the page
      - *host-timeout
      - *creds-timeout
      - DEFAULT_USER=admin
      - DEFAULT_USER_PASSWORD=${PWNBOARD_PASSWORD}
      - LOGIN_PAGE_MESSAGE=Contact an admin to get an account!
      - USE_ACCESS_TOKENS=true
    volumes:
      - ./board.json:/opt/pwnboard/board.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:alpine
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:15-alpine
    restart: always
    logging: *default-logging
    command: postgres -c synchronous_commit=off
    environment:
      POSTGRES_DB: pwnboard_db
      POSTGRES_USER: pwnboard_user
      POSTGRES_PASSWORD: ${PWNBOARD_PASSWORD}
    volumes:
      - pwnboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwnboard_user -d pwnboard_db"]
      interval: 2s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/max-49/pwnboard-worker:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_PASSWORD=${PWNBOARD_PASSWORD}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-${PWNBOARD_PASSWORD}}
      - *host-timeout
      - *creds-timeout
    volumes:
      - ./board.json:/opt/pwnboard/board.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Prediction market odds for the Grafana dashboard. Built on the host from ./market (it is
  # not in the published images), so deploy it with:  docker compose up -d --build market
  market:
    build: ./market
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_PASSWORD=${PWNBOARD_PASSWORD}
      - SCORING_URL=${SCORING_URL:-https://scoring.irsec.club/api}
      # When the competition ends, e.g. 2026-10-31T18:00:00-04:00 (otherwise ROUNDS_REMAINING is used)
      - COMPETITION_END=${COMPETITION_END:-}
      - ROUNDS_REMAINING=${ROUNDS_REMAINING:-60}
      # How wild the odds are; see market/README.md. Empty means the default.
      - UNKNOWN_POINTS_SD=${UNKNOWN_POINTS_SD:-}
      - ACCESS_PENALTY=${ACCESS_PENALTY:-}
      - FORM_WEIGHT=${FORM_WEIGHT:-}
      - FORM_HALF_LIFE=${FORM_HALF_LIFE:-}
      - PRICE_KEEP=${PRICE_KEEP:-}
      - TAIL_DF=${TAIL_DF:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  data:
    image: grafana/grafana:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${PWNBOARD_PASSWORD}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-${PWNBOARD_PASSWORD}}
      - GF_PLUGINS_PREINSTALL=magnesium-wordcloud-panel
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    volumes:
      - ./conf/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./conf/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./conf/grafana/provisioning/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - db

  reverse-proxy:
    image: caddy:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./conf/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - PWNBOARD_DOMAIN=${PWNBOARD_DOMAIN}

volumes:
  pwnboard-data:
  caddy_data:
  caddy_config:
